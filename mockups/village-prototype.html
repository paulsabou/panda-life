<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panda Life</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e3f7fb; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  .hud { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 10px; }
  .hud button {
    border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
    font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; color: #5a4a6a;
    background: rgba(255, 255, 255, .92); box-shadow: 0 3px 10px rgba(90, 74, 106, .22);
  }
  .hud button:hover { background: #ffe3ec; }
  .hint {
    position: fixed; left: 16px; top: 16px; padding: 8px 14px; border-radius: 999px;
    font: 500 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #5a4a6a; background: rgba(255, 255, 255, .85);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint">Arrow keys or click to walk</div>
<div class="hud">
  <button id="turn-left">&#8634; Turn left (Q)</button>
  <button id="turn-right">Turn right (E) &#8635;</button>
  <button id="full-screen">&#9974; Full screen (F)</button>
</div>

<script>
(function () {
  var TW = 46, TH = 23, N = 44, W = N * TW + 80, H = N * TH + 180, OX = W / 2, OY = 120, HOUSE_SIZE = 5, skipShadow = false, ROT = 0;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function pv(x, y, z) {
    return [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2 - (z || 0)];
  }

  // the world never changes when the map turns, only the way it is projected
  function view(x, y) {
    return ROT === 0 ? [x, y] : ROT === 1 ? [y, N - x] : ROT === 2 ? [N - x, N - y] : [N - y, x];
  }

  function unview(x, y) {
    return ROT === 0 ? [x, y] : ROT === 1 ? [N - y, x] : ROT === 2 ? [N - x, N - y] : [y, N - x];
  }

  function pt(x, y, z) {
    var v = view(x, y);
    return pv(v[0], v[1], z);
  }

  function poly(c, pts, fill, stroke) {
    c.beginPath();
    pts.forEach(function (p, i) { i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); });
    c.closePath();
    c.fillStyle = fill;
    c.fill();
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.2; c.lineJoin = 'round'; c.stroke(); }
  }

  function circle(c, x, y, r, fill) {
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = fill; c.fill();
  }

  function ellipse(c, x, y, rx, ry, rot, fill) {
    c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fillStyle = fill; c.fill();
  }

  function shadow(c, x, y, rx) {
    if (skipShadow) return;
    ellipse(c, x, y, rx, rx * 0.5, 0, 'rgba(70,90,60,.18)');
  }

  function heart(c, x, y, s, fill) {
    c.beginPath();
    c.moveTo(x, y + s * 0.9);
    c.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.6, y - s, x, y - s * 0.25);
    c.bezierCurveTo(x + s * 0.6, y - s, x + s * 1.5, y - s * 0.1, x, y + s * 0.9);
    c.fillStyle = fill; c.fill();
  }

  function face(c, x, y, s) {
    circle(c, x - s, y, s * 0.28, '#4a3a3a');
    circle(c, x + s, y, s * 0.28, '#4a3a3a');
    c.beginPath(); c.arc(x, y + s * 0.15, s * 0.3, 0.15 * Math.PI, 0.85 * Math.PI);
    c.strokeStyle = '#4a3a3a'; c.lineWidth = 1.2; c.lineCap = 'round'; c.stroke();
    ellipse(c, x - s * 1.5, y + s * 0.5, s * 0.42, s * 0.26, 0, 'rgba(255,120,150,.55)');
    ellipse(c, x + s * 1.5, y + s * 0.5, s * 0.42, s * 0.26, 0, 'rgba(255,120,150,.55)');
  }

  function drawGround(c, map, pal) {
    var side = 16;
    poly(c, [pv(0, N), pv(N, N), pv(N, N, -side), pv(0, N, -side)], pal.sideL);
    poly(c, [pv(N, 0), pv(N, N), pv(N, N, -side), pv(N, 0, -side)], pal.sideR);
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var t = map[y][x], d = [pt(x, y), pt(x + 1, y), pt(x + 1, y + 1), pt(x, y + 1)];
      var f = t === 'w' ? pal.water : t === 'p' ? pal.path : t === 'b' ? '#d9a877' :
        ((x + y) % 2 ? pal.grassA : pal.grassB);
      poly(c, d, f, f);
      var m = pt(x + .5, y + .5);
      if (t === 'w' && (x * 3 + y * 5) % 4 === 0) {
        c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.6; c.lineCap = 'round';
        c.beginPath(); c.moveTo(m[0] - 7, m[1]); c.quadraticCurveTo(m[0], m[1] - 3, m[0] + 7, m[1]); c.stroke();
      }
      if (t === 'b') {
        c.strokeStyle = '#b98757'; c.lineWidth = 1;
        for (var k = 1; k < 4; k++) {
          var a = pt(x + k / 4, y), b = pt(x + k / 4, y + 1);
          c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
        }
      }
    }
  }

  function house(c, o) {
    var w = HOUSE_SIZE, d = HOUSE_SIZE, H = 92, R = 60, e = 0.3;
    var a = view(o.x, o.y), b = view(o.x + w, o.y + d), x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    function left(u, z) { return pv(x + u, y + d, z); }
    function right(u, z) { return pv(x + w, y + u, z); }
    var s = pv(x + w / 2, y + d / 2), ridgeAlongX = ROT % 2 === 0;
    shadow(c, s[0], s[1] + 8, 118);
    var ridgeA, ridgeB, backSlope, frontSlope;
    if (ridgeAlongX) {
      ridgeA = pv(x - e, y + d / 2, H + R); ridgeB = pv(x + w + e, y + d / 2, H + R);
      backSlope = [pv(x - e, y - e, H - 6), pv(x + w + e, y - e, H - 6), ridgeB, ridgeA];
      frontSlope = [pv(x - e, y + d + e, H - 6), pv(x + w + e, y + d + e, H - 6), ridgeB, ridgeA];
    } else {
      ridgeA = pv(x + w / 2, y - e, H + R); ridgeB = pv(x + w / 2, y + d + e, H + R);
      backSlope = [pv(x - e, y - e, H - 6), pv(x - e, y + d + e, H - 6), ridgeB, ridgeA];
      frontSlope = [pv(x + w + e, y - e, H - 6), pv(x + w + e, y + d + e, H - 6), ridgeB, ridgeA];
    }
    poly(c, backSlope, o.roofDark, o.roofLine);
    poly(c, [right(0, 0), right(d, 0), right(d, H), right(0, H)], o.wallR, o.line);
    poly(c, [left(0, 0), left(w, 0), left(w, H), left(0, H)], o.wallL, o.line);
    if (ridgeAlongX) poly(c, [right(0, H), right(d, H), pv(x + w, y + d / 2, H + R)], o.wallR, o.line);
    else poly(c, [left(0, H), left(w, H), pv(x + w / 2, y + d, H + R)], o.wallL, o.line);
    poly(c, frontSlope, o.roof, o.roofLine);
    var r = ridgeAlongX ? pv(x + w / 2, y + d * .75, H + 30) : pv(x + w * .75, y + d / 2, H + 30);
    heart(c, r[0], r[1], 11, 'rgba(255,255,255,.85)');
    function porthole(q) { circle(c, q[0], q[1], 13, '#ffffff'); circle(c, q[0], q[1], 10, '#ffe9a8'); }
    var door = ROT === 0 ? left : ROT === 1 ? right : null, tilt = door === left ? -0.45 : 0.45;
    if (door) {
      poly(c, [door(1.5, 0), door(3.5, 0), door(3.5, 84), door(1.5, 84)], '#c98a5e', '#a86f48');
      poly(c, [door(1.7, 0), door(3.3, 0), door(3.3, 78), door(1.7, 78)], '#d99a6c');
      var kn = door(3.05, 40); circle(c, kn[0], kn[1], 3.2, '#ffe08a');
      var dh = door(2.5, 62); heart(c, dh[0], dh[1], 6, '#ffd0dc');
      [.75, 4.25].forEach(function (u) {
        porthole(door(u, 60));
        var bl = door(u, 38); ellipse(c, bl[0], bl[1], 10, 5, tilt, 'rgba(255,130,160,.55)');
      });
      porthole((door === left ? right : left)(2.5, 62));
    } else {
      porthole(left(2.5, 62)); porthole(right(2.5, 62));
    }
  }

  function bamboo(c, o) {
    var r = rng(o.seed);
    var m = pt(o.x + .5, o.y + .5);
    shadow(c, m[0], m[1] + 3, 34);
    [[-20, 4, 118], [18, 3, 142], [-2, -5, 172]].forEach(function (s, idx) {
      var bx = m[0] + s[0], by = m[1] + s[1], h = s[2] + r() * 20, sway = 5 + r() * 6;
      c.strokeStyle = '#6fc48a'; c.lineWidth = 10; c.lineCap = 'round';
      c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx, by - h / 2, bx + sway, by - h); c.stroke();
      c.strokeStyle = '#4fa56d'; c.lineWidth = 2; c.lineCap = 'butt';
      for (var n = 24; n < h; n += 24) {
        var tt = n / h, nx = bx + sway * tt * tt;
        c.beginPath(); c.moveTo(nx - 5.5, by - n); c.lineTo(nx + 5.5, by - n); c.stroke();
      }
      var leaf = idx % 2 ? '#8edb8f' : '#7ad18a', tx = bx + sway, ty = by - h;
      [[-.7, -15, 0], [.5, 15, -2], [-1.6, -13, 13], [1.3, 13, 15], [-.1, 0, -11]].forEach(function (l) {
        ellipse(c, tx + l[1], ty + l[2], 17, 5.5, l[0], leaf);
      });
      [.5, .72].forEach(function (f, i) {
        var lx = bx + sway * f * f, ly = by - h * f, dir = (i + idx) % 2 ? 1 : -1;
        ellipse(c, lx + dir * 14, ly - 4, 14, 4.5, dir * .45, leaf);
      });
    });
  }

  function tree(c, o) {
    var m = pt(o.x + .5, o.y + .5);
    shadow(c, m[0], m[1] + 3, 42);
    c.save(); c.translate(m[0], m[1]); c.scale(2.6, 2.6); c.translate(-m[0], -m[1]);
    poly(c, [[m[0] - 4, m[1]], [m[0] + 4, m[1]], [m[0] + 3, m[1] - 24], [m[0] - 3, m[1] - 24]], '#c1926a');
    circle(c, m[0] - 12, m[1] - 32, 13, o.c2);
    circle(c, m[0] + 12, m[1] - 32, 13, o.c2);
    circle(c, m[0], m[1] - 42, 18, o.c1);
    circle(c, m[0] - 5, m[1] - 49, 5, 'rgba(255,255,255,.35)');
    if (o.face) face(c, m[0], m[1] - 40, 5);
    c.restore();
  }

  function flower(c, o) {
    var m = pt(o.x + .5, o.y + .5);
    [[-8, -2, o.c], [6, 3, '#ffffff'], [-1, 6, o.c]].forEach(function (f) {
      for (var i = 0; i < 5; i++) {
        var a = i * 1.257;
        circle(c, m[0] + f[0] + Math.cos(a) * 2.4, m[1] + f[1] + Math.sin(a) * 1.8, 1.7, f[2]);
      }
      circle(c, m[0] + f[0], m[1] + f[1], 1.3, '#ffd257');
    });
  }

  function panda(c, o) {
    var m = pt(o.x + .5, o.y + .5);
    shadow(c, m[0], m[1] + 3, 15);
    c.drawImage(sushiImg, m[0] - 28, m[1] - 66, 56, 70);
  }

  var VARIANTS = {
    strawberry: { dress: '#ff7fa8', dress2: '#ff5c92', accent: '#ffd166', stripe: '#ff9fbe', iris: '#ff9fc4', shoe: '#ff5c92' },
    rainbow: { dress: 'url(#rainbow-rainbow)', dress2: '#ff7fa8', accent: '#ffd166', stripe: '#8fa9f0', iris: '#a8d8ff', shoe: '#8fa9f0' },
    mint: { dress: '#5ad1c0', dress2: '#35b8a6', accent: '#ffb3c7', stripe: '#8ee6d6', iris: '#8ee6d6', shoe: '#35b8a6' }
  };

  function sushiSvg(name, pose, phase) {
    var v = VARIANTS[name], ink = '#3a2f4a', t = pose.t, back = pose.back, walking = phase !== null, i, scallops = '';
    var off = 56 * t, sq = 1 - .22 * t, dip = walking ? 2 * Math.abs(Math.sin(phase)) : 0;
    for (i = 0; i <= 8; i++) {
      scallops += '<circle cx="' + (56 + i * 16) + '" cy="' + (244 + 15 * Math.sin(Math.PI * i / 8)) + '" r="10" fill="#fff" stroke="' + ink + '" stroke-width="3"/>';
    }
    function hrt(x, y, s, f) {
      return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M0 3C-5.5-1-2.8-4.5 0-1.6 2.8-4.5 5.5-1 0 3Z" fill="' + f + '"/>';
    }
    function eye(cx, rot, w) {
      return '<g transform="translate(' + cx + ' 100) scale(' + w + ' 1) translate(' + (-cx) + ' -100)">' +
        '<ellipse cx="' + cx + '" cy="100" rx="27" ry="31" transform="rotate(' + rot + ' ' + cx + ' 100)" fill="' + ink + '"/>' +
        '<circle cx="' + cx + '" cy="102" r="17" fill="#1b1528"/>' +
        '<ellipse cx="' + cx + '" cy="110" rx="12" ry="7" fill="' + v.iris + '"/>' +
        '<circle cx="' + (cx - 6) + '" cy="94" r="6.5" fill="#fff"/>' +
        hrt(cx + 7, 105, 1.2, '#fff') + '</g>';
    }
    // a foot swings forward in the air and slides back flat on the ground, so one is always planted
    function leg(side) {
      var a = walking ? Math.sin(phase + side * Math.PI) : 0;
      var lift = walking ? Math.max(0, Math.cos(phase + side * Math.PI)) * 14 : 0;
      var hip = 120 + (side ? 1 : -1) * 23 * (1 - .75 * t), fx = hip + a * 24 * t;
      var fy = 287 - lift + a * 3 * (1 - t) * (back ? -1 : 1), d = 'M' + hip + ' ' + (238 + dip) + 'L' + fx + ' ' + (fy - 9);
      return '<path d="' + d + '" stroke="' + ink + '" stroke-width="26" stroke-linecap="round" fill="none"/>' +
        '<path d="' + d + '" stroke="url(#stripe-' + name + ')" stroke-width="20" stroke-linecap="round" fill="none"/>' +
        '<g transform="rotate(' + (-lift * t * 1.2) + ' ' + fx + ' ' + fy + ')">' +
        '<ellipse cx="' + (fx + 6 * t) + '" cy="' + fy + '" rx="' + (20 + 4 * t) + '" ry="11" fill="' + v.shoe + '" stroke="' + ink + '" stroke-width="3"/>' +
        '<ellipse cx="' + (fx + 6 * t - 6) + '" cy="' + (fy - 4) + '" rx="5" ry="2.5" fill="rgba(255,255,255,.6)"/></g>';
    }
    function arm(cx, rot, side) {
      var swing = walking ? Math.sin(phase + side * Math.PI) * 14 : 0;
      return '<ellipse cx="' + cx + '" cy="208" rx="15" ry="35" transform="rotate(' + (rot + swing) + ' ' + cx + ' 178)" fill="' + ink + '"/>';
    }
    var nearArm = arm(58 + 60 * t, 24 * (1 - t), 0), overDress = t > .4;
    var tail = back || t > .7 ?
      '<circle cx="' + (120 - (back ? 40 : 72) * t) + '" cy="' + (back ? 224 : 236) + '" r="' + (back ? 15 : 13) + '" fill="#fff" stroke="' + ink + '" stroke-width="3"/>' : '';
    var earL = 54 - (back ? -1 : 1) * off * .2 + 66 * .2 * t, earR = 186 - (back ? -1 : 1) * off * .2 - 66 * .2 * t;
    var face = back ? '' : '<g clip-path="url(#head-' + name + ')">' +
      eye(80 + off, 18, 1) + eye(160 + off, -18, 1 - .45 * t) +
      '<ellipse cx="' + (54 + off) + '" cy="134" rx="14" ry="8" fill="#ffa3bd"/>' +
      '<ellipse cx="' + (186 + off) + '" cy="134" rx="14" ry="8" fill="#ffa3bd"/>' +
      '<g transform="translate(' + (off * 1.35) + ' 0)">' +
      '<path d="M114 122Q120 118 126 122Q124 130 120 131Q116 130 114 122Z" fill="#ff7fa8" stroke="' + ink + '" stroke-width="2"/>' +
      '<path d="M104 136Q112 148 120 134Q128 148 136 136" fill="none" stroke="' + ink + '" stroke-width="3" stroke-linecap="round"/></g></g>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="480" height="600">' +
      '<defs>' +
      '<clipPath id="head-' + name + '"><ellipse cx="120" cy="100" rx="88" ry="74"/></clipPath>' +
      '<pattern id="stripe-' + name + '" width="10" height="12" patternUnits="userSpaceOnUse">' +
      '<rect width="10" height="6" fill="#fff"/><rect y="6" width="10" height="6" fill="' + v.stripe + '"/></pattern>' +
      '<linearGradient id="rainbow-rainbow" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ff8fb3"/><stop offset=".3" stop-color="#ffc56b"/>' +
      '<stop offset=".55" stop-color="#ffe680"/><stop offset=".75" stop-color="#8fe3b0"/>' +
      '<stop offset="1" stop-color="#8fbff0"/></linearGradient></defs>' +
      leg(0) + leg(1) +
      '<g transform="translate(120 ' + dip + ') scale(' + sq + ' 1) translate(-120 0)">' +
      arm(182, -24 * (1 - t), 1) + (overDress ? '' : nearArm) + (back ? '' : tail) +
      '<ellipse cx="120" cy="212" rx="60" ry="56" fill="#fff" stroke="' + ink + '" stroke-width="3"/>' +
      scallops +
      '<path d="M90 168Q120 182 150 168L190 244Q120 270 50 244Z" fill="' + v.dress + '" stroke="' + ink + '" stroke-width="3.5" stroke-linejoin="round"/>' +
      hrt(96, 214, 2.4, '#fff') + hrt(144, 214, 2.4, '#fff') + hrt(120, 238, 2.4, '#fff') +
      hrt(120, 196, 1.8, v.accent) + hrt(78, 238, 1.8, v.accent) + hrt(162, 238, 1.8, v.accent) +
      '<circle cx="88" cy="171" r="14" fill="' + v.dress2 + '" stroke="' + ink + '" stroke-width="3"/>' +
      '<circle cx="152" cy="171" r="14" fill="' + v.dress2 + '" stroke="' + ink + '" stroke-width="3"/>' +
      (overDress ? nearArm : '') + (back ? tail : '') + '</g>' +
      '<g transform="translate(0 ' + dip + ')">' +
      '<ellipse cx="' + earL + '" cy="44" rx="31" ry="26" transform="rotate(-28 ' + earL + ' 44)" fill="' + ink + '"/>' +
      '<ellipse cx="' + earR + '" cy="44" rx="31" ry="26" transform="rotate(28 ' + earR + ' 44)" fill="' + ink + '"/>' +
      (back ? '' : '<ellipse cx="' + earL + '" cy="44" rx="15" ry="12" transform="rotate(-28 ' + earL + ' 44)" fill="#ffb3c7"/>' +
        '<ellipse cx="' + earR + '" cy="44" rx="15" ry="12" transform="rotate(28 ' + earR + ' 44)" fill="#ffb3c7"/>') +
      '<ellipse cx="120" cy="100" rx="88" ry="74" fill="#fff" stroke="' + ink + '" stroke-width="4"/>' +
      face + (back ? '<ellipse cx="120" cy="116" rx="54" ry="36" fill="#f1ecf6"/>' : '') +
      '<g transform="translate(' + (earR - 10) + ' 40) rotate(14)">' +
      '<path d="M0 0L-20-12Q-24 0-20 12ZM0 0L20-12Q24 0 20 12Z" fill="' + v.accent + '" stroke="' + ink + '" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle r="6" fill="' + v.dress2 + '" stroke="' + ink + '" stroke-width="3"/></g></g>' +
      '</svg>';
  }

  var ANIMALS = {
    cat: { fur: '#ffb56b', dark: '#f2954c', outfit: '#c6a7ee', outfit2: '#a884dc', accent: '#ffe08a', stripe: '#d9c6f5', iris: '#9fe3a8' },
    fox: { fur: '#ff8d4d', dark: '#e9692e', outfit: '#5ad1c0', outfit2: '#35b8a6', accent: '#fff1b8', stripe: '#a6ecdf', iris: '#ffd166' },
    beaver: { fur: '#b98460', dark: '#946343', outfit: '#ffd166', outfit2: '#f2b53c', accent: '#ff9fb4', stripe: '#ffe7a3', iris: '#c9a07c' },
    rabbit: { fur: '#fff7f9', dark: '#f1dbe3', outfit: '#ff9fbe', outfit2: '#ff7fa8', accent: '#ffffff', stripe: '#ffc9da', iris: '#ff9fc4' },
    deer: { fur: '#e3b27c', dark: '#c78f58', outfit: '#8edb8f', outfit2: '#67c26e', accent: '#fff1b8', stripe: '#c3eec3', iris: '#b8875a' },
    dog: { fur: '#f7dcae', dark: '#c98f5c', outfit: '#86cdec', outfit2: '#62b5dd', accent: '#ffd166', stripe: '#bfe6f6', iris: '#a8d8ff' }
  };

  function animalSvg(kind) {
    var a = ANIMALS[kind], ink = '#3a2f4a', i, scallops = '';
    for (i = 0; i <= 8; i++) {
      scallops += '<circle cx="' + (56 + i * 16) + '" cy="' + (244 + 15 * Math.sin(Math.PI * i / 8)) + '" r="10" fill="#fff" stroke="' + ink + '" stroke-width="3"/>';
    }
    function hrt(x, y, s, f) {
      return '<path transform="translate(' + x + ' ' + y + ') scale(' + s + ')" d="M0 3C-5.5-1-2.8-4.5 0-1.6 2.8-4.5 5.5-1 0 3Z" fill="' + f + '"/>';
    }
    function line(d, w, col) {
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';

      if (!len) return;
      var v = SPEED * dt / len, ox = s.x, oy = s.y;
      if (!blocked(s.x + dx * v, s.y)) s.x += dx * v;
      if (!blocked(s.x, s.y + dy * v)) s.y += dy * v;
      var mx = s.x - ox, my = s.y - oy;
      if (!mx && !my) { target = null; return; }
      s.moving = true;
      var a = view(s.x, s.y), b = view(ox, oy), vx = a[0] - b[0], vy = a[1] - b[1];
      var face = FACING[String(Math.round(Math.atan2((vx + vy) / 2, vx - vy) / (Math.PI / 4)))];
      s.pose = face[0]; s.flip = face[1];
    }

    function render() {
      var p = pt(s.x, s.y), cur = layer();
      camX = Math.max(0, Math.min(W - VW, p[0] - VW / 2));
      camY = Math.max(0, Math.min(H - VH, p[1] - VH / 2));
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(cur.canvas, camX * 2, camY * 2, VW * 2, VH * 2, 0, 0, game.width, game.height);
      if (fade > 0) {
        c.globalAlpha = fade;
        c.drawImage(fadeFrom, camX * 2, camY * 2, VW * 2, VH * 2, 0, 0, game.width, game.height);
        c.globalAlpha = 1;
      }
      c.setTransform(K, 0, 0, K, 0, 0);
      var sx = p[0] - camX, sy = p[1] - camY, sprites = SPRITES[s.pose];
      var img = s.moving ? sprites.walk[Math.floor(t * STEPS_PER_SEC) % FRAMES] : sprites.idle;
      shadow(c, sx, sy + 3, 17);
      c.save(); c.translate(sx, 0); c.scale(s.flip, 1);
      c.drawImage(img, -30, sy - 72, 60, 75);
      c.restore();

      c.save();
      c.beginPath(); c.rect(sx - 34, sy - 80, 68, 90); c.clip();
      c.translate(-camX, -camY);
      skipShadow = true;
      cur.objs.forEach(function (o) { if (o.front && o.front(s)) o.draw(c, o.a); });
      skipShadow = false;
      c.restore();

      var mx = VW - MW - 12, my = 12;
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.roundRect(mx - 6, my - 6, MW + 12, MH + 12, 10); c.fill();
      c.drawImage(cur.canvas, mx, my, MW, MH);
      var q = MW / W;
      c.strokeStyle = '#ff7fa8'; c.lineWidth = 1.5;
      c.strokeRect(mx + camX * q, my + camY * q, VW * q, VH * q);
      circle(c, mx + p[0] * q, my + p[1] * q, 3.5, '#ff5c92');
    }

    function frame(now) {
      var dt = Math.min((now - last) / 1000, .05);
      last = now; t += dt;
      fade = Math.max(0, fade - dt * 4);
      step(dt); render();
      requestAnimationFrame(frame);
    }

    var KEYMAP = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right'
    };
    window.addEventListener('keydown', function (e) {
      var k = KEYMAP[e.key];
      if (k) { keys[k] = true; e.preventDefault(); }
      if (e.key === 'q' && !e.repeat) turn(-1);
      if (e.key === 'e' && !e.repeat) turn(1);
      if (e.key === 'f' && !e.repeat) toggleFullScreen();
    });
    window.addEventListener('keyup', function (e) {
      var k = KEYMAP[e.key];
      if (k) keys[k] = false;
    });
    game.addEventListener('click', function (e) {
      var b = game.getBoundingClientRect();
      var wx = (e.clientX - b.left) * VW / b.width + camX, wy = (e.clientY - b.top) * VH / b.height + camY;
      var u = (wx - OX) / (TW / 2), w = (wy - OY) / (TH / 2);
      var g = unview((u + w) / 2, (w - u) / 2);
      target = { x: g[0], y: g[1] };
    });

    document.getElementById('turn-left').addEventListener('click', function () { turn(-1); });
    document.getElementById('turn-right').addEventListener('click', function () { turn(1); });
    document.getElementById('full-screen').addEventListener('click', toggleFullScreen);
    window.__view = function () { return { VW: VW, VH: VH, cw: game.width, ch: game.height }; };

    render();
    requestAnimationFrame(function (now) { last = now; frame(now); });
  }
  var friendJobs = Object.keys(ANIMALS).map(function (kind) {
    return loadSprite(animalSvg(kind)).then(function (im) { ANIMAL_SPRITES[kind] = im; });
  });
  Promise.all(Object.keys(POSES).map(loadPose).concat(friendJobs)).then(run);
  window.__animals = ANIMAL_SPRITES;
  window.__sprites = SPRITES;
})();
</script>
</body>
</html>
